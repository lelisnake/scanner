<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domain Keyword Scanner 2.0</title><style>body{font:15px system-ui;background:#f2f5fa;color:#17283e;margin:0}.wrap{max-width:1200px;margin:35px auto;padding:0 20px}h1{margin-bottom:4px}.muted{color:#63758c}.panel{background:white;border:1px solid #dce4ee;border-radius:14px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:600;margin-bottom:7px}textarea,input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd7e6;border-radius:8px;font:inherit}textarea{height:120px}button{background:#2269d9;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#e7eef9;color:#174b92}.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-top:16px}.controls>div{width:180px}.metrics{display:flex;gap:15px;flex-wrap:wrap}.metric{flex:1;min-width:125px}.metric b{display:block;font-size:27px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;border-bottom:1px solid #e5ebf4;text-align:left;vertical-align:top}a{color:#205fcb}#status{margin-top:15px}progress{width:100%;height:17px}#results{display:none}.scroll{overflow:auto}pre{white-space:pre-wrap;max-height:250px;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Domain Keyword Scanner 2.0</h1><div class="muted">Hybrid-Crawler · Sitemaps · Live-Fortschritt · Fehlerprotokoll</div><section class="panel"><h2>Scan starten</h2><div class="grid"><div><label>Domains (eine pro Zeile, max. 5)</label><textarea id="domains" placeholder="bonava.de"></textarea></div><div><label>Keywords (eine pro Zeile, max. 30)</label><textarea id="keywords" placeholder="nachhaltig&#10;umwelt&#10;grün"></textarea></div></div><div class="controls"><div><label>Max. Seiten je Domain</label><input id="max" type="number" min="1" max="5000" value="300"></div><div><label>Modus</label><select id="mode"><option value="hybrid">Hybrid (empfohlen)</option><option value="standard">Standard</option><option value="always">Immer rendern</option></select></div><button id="scan">Scan starten</button><button id="cancel" class="secondary" disabled>Abbrechen</button><button id="export" class="secondary" disabled>Treffer CSV</button><button id="logexport" class="secondary" disabled>Protokoll CSV</button></div><div id="status" role="status">Bereit</div><progress id="progress" value="0" max="100"></progress></section><section id="results"><div class="metrics"><div class="panel metric">Entdeckt<b id="discovered">0</b></div><div class="panel metric">Geprüft<b id="checked">0</b></div><div class="panel metric">Blockiert<b id="blocked">0</b></div><div class="panel metric">Fehler<b id="errors">0</b></div><div class="panel metric">Treffer<b id="hits">0</b></div></div><section class="panel"><h2>Suchergebnisse</h2><label>Filter</label><input id="filter" placeholder="Keyword oder URL filtern"><div class="scroll"><table><thead><tr><th>Seite</th><th>Keyword</th><th>Anzahl</th><th>Ausschnitt</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h2>Scanprotokoll</h2><pre id="logs"></pre></section></section></main><script>
let current=null,timer=null,last={results:[],logs:[]};const $=id=>document.getElementById(id);
function csv(items,keys,name){const rows=[keys,...items.map(o=>keys.map(k=>o[k]??''))];const body=rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function render(){const s=last.stats||[],sum=k=>s.reduce((a,x)=>a+(x[k]||0),0);for(const k of ['discovered','checked','blocked','errors'])$(k).textContent=sum(k);$('hits').textContent=(last.results||[]).reduce((a,x)=>a+x.count,0);$('progress').value=Math.round(100*sum('checked')/Math.max(1,sum('discovered')));$('logs').textContent=(last.logs||[]).map(x=>x.time+' '+x.type+' '+x.url+' '+x.message).join('\n');$('results').style.display='block';$('export').disabled=!last.results?.length;$('logexport').disabled=!last.logs?.length;const needle=$('filter').value.toLowerCase();$('rows').replaceChildren();for(const h of last.results||[]){if(needle&&!((h.url+' '+h.keyword).toLowerCase().includes(needle)))continue;const tr=document.createElement('tr'),td=document.createElement('td'),a=document.createElement('a');a.href=h.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=h.title||h.url;td.append(a,document.createElement('br'),document.createTextNode(h.url));tr.append(td);for(const v of [h.keyword,h.count,h.snippet]){const c=document.createElement('td');c.textContent=v;tr.append(c);}$('rows').append(tr);}}
$('filter').oninput=render;
$('scan').onclick=async()=>{if(timer)clearInterval(timer);const domains=$('domains').value.split(/\n/).map(x=>x.trim()).filter(Boolean),keywords=$('keywords').value.split(/\n/).map(x=>x.trim()).filter(Boolean);$('scan').disabled=true;$('status').textContent='Scan wird gestartet …';try{const r=await fetch('/api/scans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domains,keywords,maxPages:Number($('max').value),mode:$('mode').value})}),data=await r.json();if(!r.ok)throw Error(data.error);current=data.id;$('cancel').disabled=false;await poll();timer=setInterval(poll,1500);}catch(e){$('status').textContent='Fehler: '+e.message;$('scan').disabled=false;}};
async function poll(){if(!current)return;try{const r=await fetch('/api/scans/'+current),data=await r.json();if(!r.ok)throw Error(data.error);last=data;render();$('status').textContent='Status: '+data.status+' · '+(data.stats||[]).map(s=>s.domain+': '+s.checked+' geprüft, '+s.discovered+' entdeckt, '+s.queued+' in Warteschlange').join(' | ');if(['completed','cancelled','failed'].includes(data.status)){clearInterval(timer);timer=null;$('scan').disabled=false;$('cancel').disabled=true;}}catch(e){$('status').textContent='Verbindung: '+e.message;}}
$('cancel').onclick=async()=>{if(current)await fetch('/api/scans/'+current+'/cancel',{method:'POST'});};
$('export').onclick=()=>csv(last.results,['domain','url','title','keyword','count','snippet'],'keyword-treffer.csv');
$('logexport').onclick=()=>csv(last.logs,['time','domain','url','type','message'],'scan-protokoll.csv');
</script></body></html>
